# ==============================================================================
# Prometheus Alert Rules — Host / Node Exporter (InfraWatch N4.7)
# File: infrastructure/prometheus/rules/host_alerts.yml
# Đồng bộ với docs/KPI_DEFINITIONS.md (Mục 1.1–1.3)
# ==============================================================================

groups:
  - name: host_alerts
    rules:
      # ------------------------------------------------------------------------
      # 1.1. CPU sử dụng cao — Warning (> 80% liên tục trong 5 phút)
      # ------------------------------------------------------------------------
      - alert: HostHighCpuUsageWarning
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU cao trên máy chủ {{ $labels.hostname }}"
          description: "Máy chủ {{ $labels.hostname }} (instance: {{ $labels.instance }}): CPU sử dụng vượt quá 80% liên tục trong 5 phút."

      # ------------------------------------------------------------------------
      # 1.1. CPU sử dụng cao — Critical (> 90% trong 2 phút)
      # ------------------------------------------------------------------------
      - alert: HostHighCpuUsageCritical
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU Critical trên máy chủ {{ $labels.hostname }}"
          description: "Máy chủ {{ $labels.hostname }} (instance: {{ $labels.instance }}): CPU sử dụng vượt quá 90% trong 2 phút."

      # ------------------------------------------------------------------------
      # 1.2. RAM sử dụng cao — Warning (> 85%)
      # ------------------------------------------------------------------------
      - alert: HostHighMemoryUsageWarning
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RAM cao trên máy chủ {{ $labels.hostname }}"
          description: "Máy chủ {{ $labels.hostname }} (instance: {{ $labels.instance }}): RAM sử dụng vượt quá 85%."

      # ------------------------------------------------------------------------
      # 1.2. RAM sử dụng cao — Critical (> 95%)
      # ------------------------------------------------------------------------
      - alert: HostHighMemoryUsageCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RAM Critical trên máy chủ {{ $labels.hostname }}"
          description: "Máy chủ {{ $labels.hostname }} (instance: {{ $labels.instance }}): RAM sử dụng vượt quá 95%."

      # ------------------------------------------------------------------------
      # 1.3. Ổ cứng gần đầy — Warning (> 85% trong 2 phút)
      # ------------------------------------------------------------------------
      - alert: HostDiskSpaceFilling
        expr: (1 - (node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Ổ cứng thấp trên máy chủ {{ $labels.hostname }}"
          description: "Máy chủ {{ $labels.hostname }} (instance: {{ $labels.instance }}): phân vùng / sử dụng vượt quá 85% trong 2 phút."

      # ------------------------------------------------------------------------
      # 1.3. Ổ cứng cực kỳ đầy — Critical (> 95% trong 1 phút)
      # ------------------------------------------------------------------------
      - alert: HostDiskSpaceCritical
        expr: (1 - (node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ổ cứng cực kỳ thấp trên máy chủ {{ $labels.hostname }}"
          description: "Máy chủ {{ $labels.hostname }} (instance: {{ $labels.instance }}): phân vùng / sử dụng vượt quá 95% trong 1 phút."

      # ------------------------------------------------------------------------
      # Node Exporter mất kết nối — Critical (trong 1 phút)
      # ------------------------------------------------------------------------
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter DOWN trên máy chủ {{ $labels.hostname }}"
          description: "Target node-exporter tại {{ $labels.instance }} không phản hồi trong 1 phút."