apiVersion: 1

# Cấu hình tự động nạp nguồn dữ liệu Prometheus cho Grafana khi khởi động
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

